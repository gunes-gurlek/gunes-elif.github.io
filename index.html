<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sana Bir Mesajım Var ❤️</title>
  <style>
    body {
      background-color: #ffe6e8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    /* Zarf Tasarımı */
    .envelope {
      width: 280px;
      height: 180px;
      background-color: #ff4d6d;
      position: relative;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
    }

    .envelope:hover {
      transform: scale(1.05);
    }

    .envelope-text {
      color: white;
      font-weight: bold;
      font-size: 1.2rem;
      pointer-events: none;
    }

    /* Mektup Kartı (Başlangıçta gizli) */
    .letter {
      display: none;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 400px;
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    .letter h2 {
      color: #ff4d6d;
      margin-bottom: 15px;
    }

    .letter p {
      color: #555;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .heart-btn {
      background-color: #ff4d6d;
      color: white;
      border: none;
      padding: 10px 25px;
      font-size: 1rem;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.3s;
    }

    .heart-btn:hover {
      background-color: #c9184a;
    }

    /* YouTube iframe'ini ekranda tamamen gizliyoruz */
    #ytPlayer {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Tıklanacak Zarf -->
    <div class="envelope" id="envelope" onclick="openLetter()">
      <div class="envelope-text">✉️ Sana bir mektup var!<br><small>(Tıkla ve Aç)</small></div>
    </div>

    <!-- Mektup İçeriği -->
    <div class="letter" id="letter">
      <h2>Seni Çok Seviyorum ❤️</h2>
      <p>Dün için çok özür dilerim sevgili şeeğim...</p>
      <p><b>Barışalım mı? 🥺✨</b></p>
      <button class="heart-btn" onclick="alert('EVET dedin sayıyorum! ❤️')">Evet ❤️</button>
    </div>
  </div>

  <!-- Gizli YouTube Player Container -->
  <div id="ytPlayer"></div>

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;
    // Buraya istediğin YouTube videosunun ID'sini yaz:
    var youtubeVideoId = '6v25G3Eom0E'; 

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('ytPlayer', {
        height: '0',
        width: '0',
        videoId: youtubeVideoId,
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'loop': 1,
          'playlist': youtubeVideoId
        }
      });
    }

    function openLetter() {
      // Zarfı gizle, mektubu göster
      document.getElementById('envelope').style.display = 'none';
      document.getElementById('letter').style.display = 'block';

      // YouTube müziğini başlat
      if (player && player.playVideo) {
        player.playVideo();
      }
    }
  </script>

</body>
</html>
